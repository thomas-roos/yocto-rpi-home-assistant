;===============TRANSPORT

[general]
type=transport
protocol=udp
bind=0.0.0.0

;Templates for the necessary config sections

[endpoint_internal](!)
type=endpoint
context=Internal-Main
disallow=all
; G.722 first, by policy: one wideband codec for every client so negotiation is
; deterministic. It must be something Home Assistant's SIP client (hass-sip,
; extension 1105) can also speak - it does PCMU/PCMA/G.722 only - because
; Asterisk 22 has no opus transcoder (it ships no codec_opus; --with-opus only
; gates res_format_attr_opus for pass-through). HA carries no audio, but it has
; to negotiate something to accept the INVITE at all, or its leg goes to Down
; and no doorbell notification fires.
; opus is kept last purely as a safety net for a client that cannot do G.722;
; being after g722 it only wins if nothing else matches. vp8 is video.
allow=vp8,g722,ulaw,alaw,opus
direct_media=no

[auth_userpass](!)
type=auth
auth_type=userpass

[aor_dynamic](!)
type=aor
max_contacts=10
;Definitions for our phones, using the templates above

[1101](endpoint_internal)
auth=auth1101
aors=1101

[auth1101](auth_userpass)
password=1101
username=1101
[1101](aor_dynamic) 


[1102](endpoint_internal)
auth=auth1102
aors=1102

[auth1102](auth_userpass)
password=1102
username=1102

[1102](aor_dynamic) 

 
[1103](endpoint_internal)
auth=auth1103
aors=1103

[auth1103](auth_userpass)
password=1103
username=1103

[1103](aor_dynamic) 


[1104](endpoint_internal)
auth=auth1104
aors=1104

[auth1104](auth_userpass)
password=1104
username=1104

[1104](aor_dynamic)


; 1105 = Home Assistant (hass-sip integration). NOTE 1104 is the doorphone
; itself - it registers with username 1104 from doorphone.py - so HA must not
; use it.
[1105](endpoint_internal)
auth=auth1105
aors=1105

[auth1105](auth_userpass)
password=1105
username=1105

[1105](aor_dynamic)
