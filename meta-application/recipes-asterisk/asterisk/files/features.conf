; Door opener: whoever answered the doorbell call (callee) presses # and the
; EG front door strike opens. Asterisk publishes to the local mosquitto broker
; (TCP works from inside the systemd sandbox; /tmp/eib for knxd does not,
; asterisk.service has PrivateTmp). The HA automation
; "Türklingel - Tür öffnen mit #" switches switch.eg_haustur (KNX 4/5/0);
; the KNX actuator times the pulse itself.
[general]

[featuremap]

[applicationmap]
; Runs the [opendoor] dialplan routine (extensions.conf): open the door, then hang up.
opendoor => #,self/callee,Gosub(opendoor,s,1)
