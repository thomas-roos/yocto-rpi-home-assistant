# Do not let tailscaled take over DNS on this device.
#
# Background (2026-08-29): tailscaled installs itself as the *only* resolver in
# /etc/resolv.conf (nameserver 100.100.100.100, MagicDNS). That resolver forwards
# public names to the upstream servers the coordination server hands out - and this
# tailnet has none configured ("Resolvers: (no resolvers configured...)"), while
# tailscaled also failed to read the system defaults. Result: every public name
# returned SERVFAIL ("dns: resolver: forward: no upstream resolvers set").
#
# Fallout: from the 2026-08-18 restart until it was found on 2026-08-29 the Tibber
# integration, met.no weather and mobile_app push notifications were all dead, with
# no error beyond a ClientConnectorDNSError in the log. Local integrations (KNX, ZHA,
# SML meter, SAX battery) kept working, which is why it went unnoticed for 11 days.
#
# --accept-dns=false makes tailscaled leave /etc/resolv.conf alone, so systemd-resolved
# and the LAN resolver stay in charge. Cost: tailnet peers are reachable from this
# device by IP only, not by *.ts.net name. Inbound access via "tailscale serve" is
# unaffected - it does not depend on MagicDNS.
#
# The pref is stored in /var/lib/tailscale (bind-mounted from /data), so this only
# actually matters on a device with fresh /data; running it every start is harmless
# and keeps the setting from being re-enabled by a "tailscale up" that forgets the flag.
[Service]
ExecStartPost=-/usr/bin/tailscale set --accept-dns=false
