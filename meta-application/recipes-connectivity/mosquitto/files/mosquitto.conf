# Listen on all interfaces so LAN sensors (e.g. the water meter) and Home
# Assistant's MQTT integration can both reach this broker. The upstream
# default config (fully commented out) binds loopback only ("local only
# mode"), which silently refuses any external connection.
listener 1883 0.0.0.0

# Trusted home LAN only, matching this image's existing security posture
# (empty root password, open SSH, etc.) - no ACL/password file configured.
allow_anonymous true
