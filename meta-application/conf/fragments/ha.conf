BB_CONF_FRAGMENT_SUMMARY = "home assistant configuration with RAUC support"
BB_CONF_FRAGMENT_DESCRIPTION = "Configuration for home assistant with RAUC A/B update support, U-Boot bootloader, and optimized settings for Raspberry Pi"

QB_MEM = "-m 2048"
BOOT_SPACE = "69152"

# we are read only, no addition space necessary, except for rauc
IMAGE_OVERHEAD_FACTOR = "1.1"

BOOT_SPACE = "69152"

DISTRO_FEATURES:append = " rauc"

# we do not use bluetooth at the moment
DISTRO_FEATURES:remove = " bluetooth"

# this is required for UBoot
ENABLE_UART:rpi = "1"
RPI_USE_U_BOOT:rpi = "1"

WKS_FILE = "${THISDIR}/wic/${MACHINE}-ha_partition.wks.in"

# Settings for meta-rauc-raspberry-pi
# ext4 is needed as a standalone artifact too: ha-bundle.bb (RAUC_SLOT_rootfs[fstype]
# = "ext4") bundles ha-image-${MACHINE}.rootfs.ext4 directly, separately from the
# wic image used for initial flashing.
IMAGE_FSTYPES += "wic wic.bmap ext4"
IMAGE_INSTALL:append = " rauc"

# if not set, you will have to take care of mount points at two places, with this set image
# partition layout is done in wic file and fstab settings in ha-image.bb
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"

# we do not want to have ptests in demo images enabled, TODO use no-distro
DISTRO_FEATURES:remove = "ptest"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Disable SPDX generation for qa issues (TODO;)
INHERIT:remove = "create-spdx"
ERROR_QA:remove = "obsolete-license"
ERROR_QA:remove = "file-rdeps"
ERROR_QA:remove = "buildpaths"
# license-format became a fatal check in a newer oe-core; some recipes in
# meta-python-ai use LicenseRef-* without a matching generic license file
# (e.g. python3-cython-bbox's "LicenseRef-UCB"). Downgrade back to a warning
# rather than patching recipes in a layer that gets re-cloned pristine on
# every bitbake-setup update (TODO: fix upstream and remove this).
ERROR_QA:remove = "license-format"

FORTRAN:forcevariable = ",fortran"
RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
HOSTTOOLS += "gfortran"

LICENSE_FLAGS_ACCEPTED += "\
      commercial_ffmpeg \
      commercial \
    "

# Comment to disable BitBake build host resource pressure limits
# BB_PRESSURE_MAX_MEMORY = "150"
# BB_PRESSURE_MAX_CPU = "5000"

# this is not available in aarch64
BBMASK:rpi += "meta-python-ai/recipes-python/fsspec/python3-fsspec_2025.5.1.bbappend"

# Many meta-homeassistant/meta-openembedded recipes pin conservative upper
# bounds on their own build-time tools (setuptools, wheel,
# setuptools-git-versioning, uv_build, ...) in build-system.requires. Since
# bumping oe-core/meta-openembedded to their current master, those pins are
# routinely exceeded by the native tool versions we actually have - even
# though the newer tools build these packages fine (verified case-by-case
# before adding this). Skip pyproject-build's version-satisfaction check
# globally instead of chasing every individual recipe's pin.
PEP517_BUILD_OPTS:append = " --skip-dependency-check"
