# Default knxd config for this house's gateway (Raspberry Pi, busware.de TPUART
# USB stick on /dev/ttyACM0). Deployed to /etc/knxd/knxd.conf on first boot, then
# lives on the persistent /data partition (bind-mounted over /etc/knxd) so it
# survives RAUC A/B image updates.
#
# Migrated from the BeagleBone eibd gateway (192.168.0.27, died 2026-06-11) on
# 2026-06-12. See https://github.com/thomas-roos/ha-knx-gateway for history.
# Equivalent of: -e 0.0.240 -E 0.0.241:8 -D -T -R -S -u /tmp/eib -b tpuarts:/dev/ttyACM0
#
# Note: the driver name in this INI format is "tpuart", not the CLI URL name
# "tpuarts".

[main]
addr = 0.0.240
client-addrs = 0.0.241:8
connections = server,tpuart,unix-server

[tpuart]
driver = tpuart
device = /dev/ttyACM0

[server]
server = ets_router
discover = true
tunnel = tunnel
router = router

[tunnel]

[router]

[unix-server]
server = knxd_unix
path = /tmp/eib
